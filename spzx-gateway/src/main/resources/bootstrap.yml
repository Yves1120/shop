# Tomcat
server:
  port: 8080

# Spring
spring:
  application:
    # 应用名称
    name: spzx-gateway
  profiles:
    # 环境配置
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      password:
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:8848
      config:
        # 配置中心地址
        server-addr: localhost:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      enabled: false
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: spzx-auth
          uri: lb://spzx-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: spzx-system
          uri: lb://spzx-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: spzx-product
          uri: lb://spzx-product
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        - id: spzx-user
          uri: lb://spzx-user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: spzx-order
          uri: lb://spzx-order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
        - id: spzx-cart
          uri: lb://spzx-cart
          predicates:
            - Path=/cart/**
          filters:
            - StripPrefix=1
        - id: spzx-auth-h5
          uri: lb://spzx-auth
          predicates:
            - Path=/h5/**
          filters:
            - StripPrefix=1
        - id: spzx-channel
          uri: lb://spzx-channel
          predicates:
            - Path=/channel/**
          filters:
            - StripPrefix=1
        - id: spzx-payment
          uri: lb://spzx-payment
          predicates:
            - Path=/payment/**
          filters:
            - StripPrefix=1

  main:
    web-application-type: reactive

# 安全配置
security:
  ignore:
    whites:
      - /auth/login
      - /auth/logout
      - /auth/register
      - /code
      - /auth/h5/login
      - /auth/h5/register
      - /auth/h5/logout
      - /channel/index
      - /channel/category/tree
      - /channel/list
      - /channel/brand/getBrandAll
      - /channel/item
      - /user/userInfo/generateValidateCode
      - /payment/alipay/notify
      - /payment/alipay/return
      - /payment/alipay/mockPay
  captcha:
    enabled: true
    type: math
