# Tomcat
server:
  port: 9208

# Spring
spring:
  application:
    name: spzx-channel
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    sentinel:
      enabled: false
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
