# Tomcat
server:
  port: 9200

# Spring
spring:
  application:
    # 应用名称
    name: spzx-auth
  profiles:
    # 环境配置
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      password:
  cloud:
    sentinel:
      enabled: false
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:8848
      config:
        # 配置中心地址
        server-addr: localhost:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
